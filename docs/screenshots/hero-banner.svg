<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1829"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Indigo Accent Glow -->
    <radialGradient id="indigoGlow" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Document Card Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <style>
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #34d399; letter-spacing: 1.5px; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 54px; font-weight: 800; fill: url(#titleGrad); letter-spacing: -1.5px; }
    .tagline-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 400; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Base Card Frame -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="340" rx="16" fill="url(#indigoGlow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="15.25" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Proposal Deck Graphic on Right Side -->
  <g transform="translate(860, 60)" opacity="0.85">
    <!-- Background page shadow -->
    <rect x="50" y="20" width="160" height="210" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1.5" transform="rotate(8 130 125)"/>
    
    <!-- Middle page -->
    <rect x="25" y="10" width="160" height="210" rx="10" fill="#131e33" stroke="#334155" stroke-width="1.5" transform="rotate(4 105 115)"/>
    
    <!-- Front proposal page (A4 aesthetic) -->
    <rect x="0" y="0" width="160" height="210" rx="10" fill="url(#docGrad)" stroke="#34d399" stroke-width="1.5"/>

    <!-- Document simulated content -->
    <rect x="18" y="24" width="75" height="8" rx="4" fill="#34d399"/>
    <rect x="18" y="42" width="124" height="4" rx="2" fill="#475569"/>
    <rect x="18" y="52" width="105" height="4" rx="2" fill="#475569"/>
    <rect x="18" y="62" width="115" height="4" rx="2" fill="#475569"/>

    <!-- Investment Tier Preview Block -->
    <rect x="18" y="85" width="124" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="26" y="96" width="40" height="6" rx="3" fill="#38bdf8"/>
    <rect x="26" y="108" width="65" height="12" rx="3" fill="#34d399" fill-opacity="0.3"/>
    <rect x="26" y="126" width="105" height="4" rx="2" fill="#475569"/>

    <!-- Signed badge pill -->
    <g transform="translate(18, 160)">
      <rect width="70" height="22" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#34d399"/>
      <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#a7f3d0">APPROVED</text>
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(64, 48)">
    <!-- Architecture Tag Badge -->
    <g transform="translate(0, 0)">
      <rect width="215" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#34d399"/>
      <text x="26" y="17" class="badge-text">AETHEROS CLOSING AGENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" class="title-text">Closer</text>

    <!-- Tagline -->
    <text x="0" y="124" class="tagline-text">Autonomous AI Deal Closer &amp; Multi-Page Commercial Proposal Studio</text>

    <!-- Tech Pills Row -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: Next.js 16 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#ffffff"/>
        <text x="32" y="22" class="pill-text">Next.js 16.2</text>
      </g>

      <!-- Pill 2: Anthropic Claude Opus -->
      <g transform="translate(148, 0)">
        <rect width="186" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#d97706"/>
        <text x="32" y="22" class="pill-text">Claude Opus / Sonnet</text>
      </g>

      <!-- Pill 3: Puppeteer PDF Engine -->
      <g transform="translate(344, 0)">
        <rect width="176" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#10b981"/>
        <text x="32" y="22" class="pill-text">Puppeteer PDF Engine</text>
      </g>

      <!-- Pill 4: Fireflies Intel -->
      <g transform="translate(530, 0)">
        <rect width="176" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#818cf8"/>
        <text x="32" y="22" class="pill-text">Fireflies Call Intel</text>
      </g>
    </g>
  </g>
</svg>
